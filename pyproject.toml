[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-footprint"
version = "0.1.0"
description = "Web & App Security Auditor (DevSecOps) + Digital Footprint & Personal Privacy Cleaner"
readme = "README.md"
authors = [{ name = "Security Architect", email = "security@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
